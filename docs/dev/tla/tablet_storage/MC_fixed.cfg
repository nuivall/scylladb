\* expect: pass
\* ci: yes
\* Both fixed: no failed completion deletes an input, a restart voids the streaming response.
SPECIFICATION Spec
CONSTANTS
    Shards = {1, 2}
    MaxWrites = 2
    MaxOps = 2
    MaxRestarts = 1
    MaxFails = 1
    MaxMigrations = 1
    BypassFailDeletesInput = FALSE
    CloneUnsealed = TRUE
    AttachAtomic = TRUE
    RestartKeepsResponse = FALSE
INVARIANTS
    Durable
    Readable
    SplitAckHolds
    NoAbort
    BootOK
