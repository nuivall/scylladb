\* expect: ReadsSeeAckedWrites
\* ci: yes
\* Ablation: no barrier at write_both_read_new: a read of the old replicas misses a write acknowledged by the new ones.
SPECIFICATION Spec
CONSTANTS
    A = A
    B = B
    C = C
    NoHost = NoHost
    Hosts = {A, B, C}
    InitReplicas = {A, B}
    SkipBarrier = {"write_both_read_new"}
    GuardChecksSession = TRUE
    WriteCL = 1
    ReadCL = 2
    MaxMigrations = 1
    MaxFailures = 0
    MaxWrites = 1
    MaxReads = 1
    MaxRpcs = 2
SYMMETRY Symm
VIEW StateView
INVARIANTS
    ReadsSeeAckedWrites
    StorageOnReplicasOnly
